
name: Build NestCam Phone and Watch8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d source
          test -f source/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Phone and Watch APK
        run: |
          gradle -p source \
            :mobile:assembleDebug \
            :wear:assembleDebug \
            --no-daemon --stacktrace

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: NestCam-Phone-APK
          path: source/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Watch8 APK
        uses: actions/upload-artifact@v4
        with:
          name: NestCam-Watch8-APK
          path: source/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
