
name: Build NestCam Phone Watch8

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip Source
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS=$(find source -name settings.gradle -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Check Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || \
             [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager --install \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

      - name: Build Phone and Watch8
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            :mobile:assembleDebug \
            :wear:assembleDebug \
            --no-daemon --stacktrace

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: NestCam-Phone-APK
          path: ${{ env.PROJECT_DIR }}/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Watch8 APK
        uses: actions/upload-artifact@v4
        with:
          name: NestCam-Watch8-APK
          path: ${{ env.PROJECT_DIR }}/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
